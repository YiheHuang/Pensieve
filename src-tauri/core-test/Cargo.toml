[package]
name = "pensieve-core-tests"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
mime_guess = "2"
rand = "0.9"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
zip = { version = "7", default-features = false, features = ["deflate"] }
